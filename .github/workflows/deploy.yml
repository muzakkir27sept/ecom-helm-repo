name: Deploy Ecom API to EKS

on:
  push:
    branches:
      - main
    paths:
      - 'ecom-api-modern/**'

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Helm repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::127101021174:role/GitHubActionsEKSDeployRole
          aws-region: us-east-1
      - name: Update kubeconfig for EKS
        run: aws eks update-kubeconfig --name eks-demo-cluster --region us-east-1
      - name: Verify EKS connection
        run: kubectl get namespace dev
      - name: Verify EKS connection
        run: kubectl get namespace dev

      - name: Deploy with Helm
        run: |
          helm upgrade --install ecom-api-modern ./ecom-api-modern \
            --namespace dev

      - name: Verify deployment rollout
        run: kubectl rollout status deployment/ecom-api-modern -n dev --timeout=180s

      - name: Check application resources
        run: |
          kubectl get pods -n dev
          kubectl get service -n dev
          kubectl get ingress -n dev
